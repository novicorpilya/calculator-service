<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HICS | Профессиональный расчет инвентаря HoReCa</title>
    <meta
      name="description"
      content="Интеллектуальная экосистема для управления закупками инвентаря. Стандартизация норм HACCP, оптимизация бюджета до 30% и экспертное сопровождение объектов HoReCa."
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="HICS | Экспертное управление инвентарем"
    />
    <meta
      property="og:description"
      content="Превратите хаотичные расходы в точную науку. Робот-калькулятор и живая экспертиза для вашего бизнеса."
    />
    <meta property="og:image" content="/og-preview.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="HICS | Расчет инвентаря HoReCa" />
    <meta
      property="twitter:description"
      content="Система профессионального расчета норм расхода и управления сметами закупок."
    />
  </head>
  <body style="background-color: #050506; margin: 0; font-family: sans-serif;">
    <div id="root">
      <!-- Pre-mount Loader (Static CSS) -->
      <div id="pre-loader" style="height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; background: #050506; position: relative;">
        <!-- Ambient Background Glow (Static) -->
        <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 300px; height: 300px; background: rgba(99, 102, 241, 0.1); border-radius: 50%; filter: blur(80px);"></div>
        
        <div style="position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center;">
          <!-- HICS Static Shell -->
          <div style="width: 80px; height: 80px; background: white; border-radius: 24px; display: flex; align-items: center; justify-content: center; margin-bottom: 32px; box-shadow: 0 20px 40px rgba(0,0,0,0.5);">
             <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#050506" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
          </div>
          
          <div style="font-weight: 900; color: white; font-size: 42px; letter-spacing: -0.05em; margin-bottom: 8px;">HICS</div>
          <div style="color: rgba(255,255,255,0.2); font-size: 8px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.8em; margin-bottom: 40px;">ЭКОСИСТЕМА</div>
          
          <div style="width: 200px; height: 3px; background: rgba(255,255,255,0.05); position: relative; overflow: hidden; border-radius: 10px;">
            <div style="position: absolute; top: 0; left: 0; height: 100%; background: #6366f1; width: 40%; animation: initial-load 2.5s infinite cubic-bezier(0.65, 0, 0.35, 1);"></div>
          </div>
        </div>
      </div>
      <style>
        @keyframes initial-load {
          0% { left: -40%; width: 20%; }
          50% { width: 50%; }
          100% { left: 140%; width: 20%; }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
